name: compilar-121

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'dependabot/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build EMF for 1.21 (Fabric)
        run: ./gradlew :1.21-fabric:build --no-daemon

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emf-1.21-jar
          path: versions/1.21-fabric/build/libs/
